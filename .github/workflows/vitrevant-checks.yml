# Copy to a repo as .github/workflows/vitrevant-checks.yml. Runs the SAME provenance/audit checks the
# Cloud Run gate ran, but on a self-hosted runner on the box — outbound-only, no inbound webhook. The
# required check name(s) are set in branch protection so a red job blocks the merge (reviewer != author
# stays enforced by GitHub branch protection).
name: vitrevant
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main, master]
jobs:
  provenance:
    runs-on: [self-hosted, vitrevant]        # the box's runner label
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: vitrevant provenance + audit + sources checks
        run: bash "$VLI_HOME/runner/run_checks.sh"
        env:
          VLI_HOME: ${{ vars.VLI_HOME || '/home/ubuntu/ec2' }}
          # Override the sink path explicitly so the runner writes to the same path the
          # Docker containers bind-mount. Set VLI_SINK_DIR as a repo variable (gh variable set)
          # when VLI_HOME and APPLIANCE_ROOT differ on the box (e.g. demo installs).
          VLI_SINK_DIR: "${{ vars.VLI_SINK_DIR || '' }}"
          # PROVENANCE-UNTAGGED: code outside any fence. warn (default) | block | off.
          # Run warn first, baseline-tag the repo, then flip to block AND say so in the guardrail.
          PROVENANCE_UNTAGGED: "${{ vars.VLI_PROVENANCE_UNTAGGED || 'warn' }}"
          # Demo/rollout knobs (see RUNBOOK "Demo profile"). Leave unset for normal operation.
          VLI_RECONCILE_MIN_CHARS: "${{ vars.VLI_RECONCILE_MIN_CHARS || '' }}"
          VITREVANT_RECONCILE: "${{ vars.VITREVANT_RECONCILE || 'on' }}"
          # 5.1 static analysis: off | warn | block. Tools are enabled per-repo in .vitrevant-static.json;
          # a configured tool that is missing on the runner is STATIC-NOT-RUN, and fails the gate in block.
          VLI_STATIC_ANALYSIS: "${{ vars.VLI_STATIC_ANALYSIS || 'warn' }}"
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}       # the viewer shows it; without it PRs are bare numbers
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  reindex:
    runs-on: [self-hosted, vitrevant]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: reindex project into refdocs RAG
        run: |
          REPO_NAME=$(basename "${{ github.repository }}")
          PROJECTS_DIR=/opt/appliance/data/projects
          rsync -a --delete "$GITHUB_WORKSPACE/" "$PROJECTS_DIR/$REPO_NAME/"
          docker exec appliance-refdocs python3 /app/ingest_project.py \
            "/projects/$REPO_NAME" --project "$REPO_NAME"
        env:
          VLI_HOME: ${{ vars.VLI_HOME || '/home/ubuntu/ec2' }}

  record-close:
    runs-on: [self-hosted, vitrevant]
    if: github.event.action == 'closed'
    steps:
      - name: record PR close in sink
        run: bash "$VLI_HOME/runner/record_close.sh"
        env:
          VLI_HOME: ${{ vars.VLI_HOME || '/home/ubuntu/ec2' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          REPO: ${{ github.repository }}
